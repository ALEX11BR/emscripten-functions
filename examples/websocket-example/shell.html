<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>websocket-example</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body {
            padding: 0;
            margin: 0;
            width: 100vw;
            height: 100vh;
        }
        #app-display {
            padding: 0;
            margin: 0;
            width: 100vw;
            height: 100vh;

            display: grid;
            align-content: center;
            justify-content: center;

            text-align: center;
        }

        #loading-display {
            padding: 0;
            margin: 0;
            width: 100vw;
            height: 100vh;

            position: fixed;
            background-color: transparent;

            display: grid;
            place-items: center;
        }
        #loading-square {
            width: 10px;
            height: 10px;

            background-color: black;

            animation: loading-animation 2s infinite;
        }
        @keyframes loading-animation {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(5);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div id="app-display">
        <p>Look in the JavaScript console for the message <em>wss://echo.websocket.org/</em> sent us after sending 'Hello'.</p>
        <p>Ignore the first error.</p>
    </div>

    <div id="loading-display">
        <div id="loading-square"></div>
    </div>

    <script>
        var Module = {
            setStatus: (status) => {
                if (status === "Running...") {
                    document.getElementById("loading-display").remove();
                }
            },
            monitorRunDependencies: (depsLeft) => {
                let loadingSquare = document.getElementById("loading-square")
                loadingSquare.style.backgroundColor = "#00" + ((4 - depsLeft) * 63).toString(16) + "00"
            },
        }
    </script>
    {{{ SCRIPT }}}
</body>
</html>
